name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project File
      run: |
        python3 -c "import zipfile, glob; zip_file = glob.glob('*.zip')[0]; zipfile.ZipFile(zip_file).extractall('extracted_app')"
        find extracted_app -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        GRADLE_PATH=$(find extracted_app -name "gradlew" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-APK
        path: '**/build/outputs/apk/debug/*.apk'
