name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract zip file
      run: |
        python3 -c "import zipfile, glob, os; z = glob.glob('*.zip')[0]; zipfile.ZipFile(z).extractall('app_src')"
        find app_src -name "gradlew" -exec chmod +x {} \;

    - name: Build with Gradle
      run: |
        GPATH=$(find app_src -name "gradlew" | head -n 1)
        cd $(dirname "$GPATH")
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-App
        path: '**/build/outputs/apk/debug/*.apk'
