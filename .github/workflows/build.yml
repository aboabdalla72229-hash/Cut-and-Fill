name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    - name: Unzip Project Files
      run: |
        python3 -c "import zipfile, glob; z = glob.glob('*.zip')[0]; zipfile.ZipFile(z).extractall('app_src')"

    - name: Generate Clean Gradle Wrapper & Build APK
      run: |
        # Locate project root directory
        PROJ_DIR=$(dirname $(find app_src -name "settings.gradle" | head -n 1))
        cd "$PROJ_DIR"
        
        # Regenerate gradlew to replace broken file
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        
        # Build Debug APK suppressing legacy property errors
        ./gradlew assembleDebug -Pandroid.defaults.buildfeatures.buildconfig=true --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-APK
        path: '**/build/outputs/apk/debug/*.apk'
