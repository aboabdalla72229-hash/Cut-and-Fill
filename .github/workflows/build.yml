name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract ZIP File
      run: |
        python3 -c "import zipfile, glob; z = glob.glob('*.zip')[0]; zipfile.ZipFile(z).extractall('app_src')"

    - name: Fix App build.gradle
      run: |
        APP_GRADLE=$(find app_src -name "build.gradle" | grep "app" | head -n 1)
        sed -i 's/android {/android {\n    namespace "com.surveyquant.app"/' "$APP_GRADLE"

    - name: Build APK with Gradle Wrapper
      run: |
        PROJ_DIR=$(dirname $(find app_src -name "settings.gradle" | head -n 1))
        cd "$PROJ_DIR"
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-APK
        path: '**/build/outputs/apk/debug/*.apk'
