name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP File
      run: |
        python3 -c "import zipfile, glob; z = glob.glob('*.zip')[0]; zipfile.ZipFile(z).extractall('app_src')"

    - name: Fix Permissions and Find Project
      run: |
        find app_src -name "gradlew" -exec chmod +x {} \;

    - name: Build APK
      run: |
        GRADLEW_PATH=$(find app_src -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          CD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$CD_DIR"
          ./gradlew assembleDebug -Pandroid.defaults.buildfeatures.buildconfig=true --no-daemon
        else
          BUILD_FILE=$(find app_src -name "build.gradle" | head -n 1)
          CD_DIR=$(dirname "$BUILD_FILE")
          cd "$CD_DIR"
          gradle assembleDebug -Pandroid.defaults.buildfeatures.buildconfig=true --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-APK
        path: '**/build/outputs/apk/debug/*.apk'
