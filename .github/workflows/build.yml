name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract ZIP File
      run: |
        python3 -c "import zipfile, glob; z = glob.glob('*.zip')[0]; zipfile.ZipFile(z).extractall('app_src')"

    - name: Build APK with System Gradle
      run: |
        BUILD_FILE=$(find app_src -name "build.gradle" | head -n 1)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurveyQuant-APK
        path: '**/build/outputs/apk/debug/*.apk'
