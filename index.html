<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyQuant - برنامج الحسابات والكنتور الـ DXF</title>
    <style>
        :root {
            --bg-dark: #121820;
            --card-bg: #1e2736;
            --accent-blue: #0088ff;
            --accent-green: #2ecc71;
            --accent-red: #ff4d4d;
            --border-color: #2c3b52;
            --text-main: #e0e8f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .section { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #a0b2ce; }
        input[type="file"], input[type="number"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #0f141d; color: #fff; box-sizing: border-box; font-size: 14px; margin-bottom: 10px;
        }
        .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .radio-grid label { font-weight: normal; cursor: pointer; background: #0f141d; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        button {
            width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #0066cc; }
        .results-box {
            display: none; background: #0f141d; border: 1px dashed var(--accent-blue);
            padding: 15px; border-radius: 8px; margin-top: 20px; text-align: right;
        }
        .info-list { background: #1a232e; padding: 10px 15px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
        .btn-download {
            background: var(--accent-green); margin-top: 15px; display: block; text-align: center;
            text-decoration: none; padding: 14px 20px; border-radius: 6px; font-weight: bold; color: white;
            font-size: 16px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📐 SurveyQuant: تحليل المناسيب والكنتور والكميات</h2>

    <div class="section">
        <label>1. اختر ملف النقاط المساحية (SDR, CSV, TXT, DAT):</label>
        <input type="file" id="fileInput" accept=".sdr,.csv,.txt,.dat">
    </div>

    <div class="section">
        <label>2. طريقة تحديد منسوب المقارنة / التصميم:</label>
        <div class="radio-grid">
            <label><input type="radio" name="levelType" value="max" onclick="toggleLevelInput()"> أعلى منسوب بالملف</label>
            <label><input type="radio" name="levelType" value="min" onclick="toggleLevelInput()"> أقل منسوب بالملف</label>
            <label><input type="radio" name="levelType" value="avg" onclick="toggleLevelInput()"> متوسط المناسيب</label>
            <label><input type="radio" name="levelType" value="manual" checked onclick="toggleLevelInput()"> إدخال يدوي</label>
        </div>
        <input type="number" id="targetLevel" step="0.001" placeholder="أدخل المنسوب المطلوب يدويًا (مثال: 105.50)">
    </div>

    <div class="section">
        <label>3. الفترة الكنتورية (Contour Interval) بالمتر:</label>
        <input type="number" id="contourInterval" step="0.1" value="1.0">
    </div>

    <button type="button" onclick="processSurveyData(event)">معالجة البيانات وحساب الكميات وتوليد الـ DXF</button>

    <div id="results" class="results-box">
        <h3 style="color: var(--accent-blue); text-align: center;">نتائج المعالجة والحسابات</h3>
        
        <div class="info-list">
            <p>📌 <strong>أعلى منسوب بالملف:</strong> <span id="maxLevelText"></span></p>
            <p>🔻 <strong>أقل 3 مناسيب بالملف:</strong></p>
            <ul id="minLevelsList" style="margin: 0; padding-right: 20px;"></ul>
        </div>

        <p id="levelInfo" style="font-weight: bold; font-size: 15px;"></p>
        <p id="cutVolume" style="color: var(--accent-red); font-size: 18px; font-weight: bold;"></p>
        <p id="fillVolume" style="color: var(--accent-green); font-size: 18px; font-weight: bold;"></p>
        
        <button type="button" id="downloadBtn" class="btn-download" onclick="downloadDXFFile()">💾 تحميل لوحة DXF للاوتوكاد</button>
    </div>
</div>

<script>
let points = [];
let generatedDXFString = "";

function toggleLevelInput() {
    const type = document.querySelector('input[name="levelType"]:checked').value;
    const input = document.getElementById('targetLevel');
    input.style.display = (type === 'manual') ? 'block' : 'none';
}

function parseSDRorCSV(text) {
    let parsedPoints = [];
    let lines = text.split('\n');
    
    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        if (line.startsWith('08TP') || line.startsWith('08KI')) {
            let pName = line.substring(4, 20).trim();
            let n = parseFloat(line.substring(20, 36));
            let e = parseFloat(line.substring(36, 52));
            let z = parseFloat(line.substring(52, 68));
            if (!isNaN(n) && !isNaN(e) && !isNaN(z)) {
                parsedPoints.push({ id: pName, e: e, n: n, z: z });
            }
        } else {
            let parts = line.split(/[, \t]+/);
            if (parts.length >= 4) {
                let p1 = parseFloat(parts[1]), p2 = parseFloat(parts[2]), p3 = parseFloat(parts[3]);
                if (!isNaN(p1) && !isNaN(p2) && !isNaN(p3)) {
                    parsedPoints.push({ id: parts[0], e: p1, n: p2, z: p3 });
                }
            }
        }
    }
    return parsedPoints;
}

function processSurveyData(e) {
    if(e) e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) {
        alert("يرجى اختيار ملف نقاط أولاً!");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
        points = parseSDRorCSV(evt.target.result);
        if (points.length === 0) {
            alert("لم يتم العثور على نقاط صالحة في الملف. يرجى التأكد من الصيغة.");
            return;
        }

        calculateAndGenerateDXF();
    };
    reader.readAsText(fileInput.files[0]);
}

function calculateAndGenerateDXF() {
    let sortedPoints = [...points].sort((a, b) => a.z - b.z);
    
    let min3 = sortedPoints.slice(0, 3);
    let maxPt = sortedPoints[sortedPoints.length - 1];
    
    let zValues = points.map(p => p.z);
    let minZ = min3[0].z;
    let maxZ = maxPt.z;
    let avgZ = zValues.reduce((a, b) => a + b, 0) / zValues.length;

    let levelType = document.querySelector('input[name="levelType"]:checked').value;
    let targetZ = maxZ;
    if (levelType === 'min') targetZ = minZ;
    else if (levelType === 'avg') targetZ = avgZ;
    else if (levelType === 'manual') targetZ = parseFloat(document.getElementById('targetLevel').value) || avgZ;

    document.getElementById('maxLevelText').innerText = `${maxPt.z.toFixed(3)} م (نقطة: ${maxPt.id})`;
    
    let minListHTML = "";
    min3.forEach((p) => {
        minListHTML += `<li>نقطة (${p.id}): <strong>${p.z.toFixed(3)} م</strong></li>`;
    });
    document.getElementById('minLevelsList').innerHTML = minListHTML;

    // حساب كميات الحفر والردم
    let minE = Math.min(...points.map(p => p.e));
    let maxE = Math.max(...points.map(p => p.e));
    let minN = Math.min(...points.map(p => p.n));
    let maxN = Math.max(...points.map(p => p.n));

    let gridSize = 1.0; 
    let totalCut = 0, totalFill = 0;

    for (let e = minE; e <= maxE; e += gridSize) {
        for (let n = minN; n <= maxN; n += gridSize) {
            let near = points[0], minD = Infinity;
            for (let p of points) {
                let d = Math.hypot(p.e - e, p.n - n);
                if (d < minD) { minD = d; near = p; }
            }
            let diff = near.z - targetZ;
            if (diff > 0) totalCut += diff * (gridSize * gridSize);
            else totalFill += Math.abs(diff) * (gridSize * gridSize);
        }
    }

    document.getElementById('levelInfo').innerText = `منسوب المقارنة/التصميم المستخدم: ${targetZ.toFixed(3)} م`;
    document.getElementById('cutVolume').innerText = `إجمالي كمية الحفر (Cut): ${totalCut.toFixed(2)} م³`;
    document.getElementById('fillVolume').innerText = `إجمالي كمية الردم (Fill): ${totalFill.toFixed(2)} م³`;
    document.getElementById('results').style.display = 'block';

    // بناء ملف DXF كـ String مباشر وبدون مكتبات خارجية
    let dxf = [];
    dxf.push("0\nSECTION\n2\nENTITIES");

    // رسم النقاط والنصوص
    for (let p of points) {
        // Point
        dxf.push(`0\nPOINT\n8\nNGL_POINTS\n10\n${p.e}\n20\n${p.n}\n30\n${p.z}`);
        // Text
        dxf.push(`0\nTEXT\n8\nNGL_POINTS\n10\n${p.e + 0.2}\n20\n${p.n + 0.2}\n30\n${p.z}\n40\n0.3\n1\nZ:${p.z.toFixed(2)}`);
    }

    // جدول التفاصيل والكميات
    let tX = maxE + 5, tY = maxN;
    let addText = (x, y, txt, size=0.7) => {
        dxf.push(`0\nTEXT\n8\nQUANTITIES_TABLE\n10\n${x}\n20\n${y}\n30\n0\n40\n${size}\n1\n${txt}`);
    };

    addText(tX, tY, "--- SURVEYQUANT SUMMARY TABLE ---", 1.0);
    addText(tX, tY - 2, `Total Points: ${points.length}`);
    addText(tX, tY - 4, `Max Level (Pt ${maxPt.id}): ${maxPt.z.toFixed(3)} m`);
    
    min3.forEach((p, idx) => {
        addText(tX, tY - 6 - (idx * 2), `Min Level ${idx+1} (Pt ${p.id}): ${p.z.toFixed(3)} m`, 0.6);
    });

    let offset = 6 + (min3.length * 2);
    addText(tX, tY - offset, `Design Level: ${targetZ.toFixed(3)} m`);
    addText(tX, tY - offset - 2, `CUT VOLUME: ${totalCut.toFixed(2)} m3`, 0.8);
    addText(tX, tY - offset - 4, `FILL VOLUME: ${totalFill.toFixed(2)} m3`, 0.8);

    dxf.push("0\nENDSEC\n0\nEOF");
    generatedDXFString = dxf.join("\n");
}

function downloadDXFFile() {
    if (!generatedDXFString) {
        alert("يرجى معالجة البيانات أولاً!");
        return;
    }
    const blob = new Blob([generatedDXFString], { type: 'application/dxf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Survey_Contour_Quantities.dxf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
